syntax = "proto3";
package protos;

import "gogoproto/gogo.proto";
option (gogoproto.goproto_unrecognized_all) = false;
option (gogoproto.goproto_unkeyed_all) = false;
option (gogoproto.goproto_sizecache_all) = false;
option (gogoproto.goproto_getters_all) = true;

// 握手
message ClientHello {
  int32 ProtocolVersion = 1;                // 协议版本
  int32 Extension = 10;                     // 扩展
  int64 Timestamp = 3;                      // 客户端时间戳
  bytes ClientNonce = 5;                    // client nonce
  bytes ClientPubKey = 6;                   // client public key
  uint64 ClientRandom = 4;                  // client random
  repeated int32 SupportedCipherSuites = 7; // 支持的加密套件
}

message ServerHello {
  int32 Code = 1;
  int32 ProtocolVersion = 2;  // 协议版本
  int64 Timestamp = 3;        // 服务器时间戳
  bytes ServerNonce = 6;      // server nonce
  bytes ServerPubKey = 7;     // server public key
  uint64 ServerRandom = 4;    // server random
  int32 CipherSuite = 8;      // 选定的加密套件
  int32 Extension = 10;       // 扩展
  uint32 ServerSessionId = 9; // 会话ID（用于random)
}
